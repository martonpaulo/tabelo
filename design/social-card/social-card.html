<!doctype html>
<!-- Tabelo social card. Source of truth for apps/web/public/social-card.jpg, served at
     https://tabelo.martonpaulo.com/social-card.jpg (1200x630). Never edit the JPEG.
     Render on a Mac (the drawn interface uses the system font): pnpm -C apps/web social-card
     System, grid and contrast rules: the social card standard (skill-deck#261).
     Fonts: Gabarito and Figtree (OFL, fonts/*-OFL.txt), the typefaces of martonpaulo.com. -->
<meta charset="utf-8">
<title>Tabelo social card</title>
<style>
@font-face { font-family: "Gabarito"; font-weight: 700; src: url(fonts/gabarito-latin-700-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 400; src: url(fonts/figtree-latin-400-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 500; src: url(fonts/figtree-latin-500-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 600; src: url(fonts/figtree-latin-600-normal.woff2); }
@font-face { font-family: "Figtree"; font-weight: 700; src: url(fonts/figtree-latin-700-normal.woff2); }
html, body { margin: 0; }
.card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: "Figtree", sans-serif;
        color: var(--ink); background: var(--gradient); }
.card::before { content: ""; position: absolute; inset: 0; background: var(--glow, none); }
/* One grid for every card: the copy block is centred vertically in a 440px column at x=96;
   the product visual always starts at x=600, a fixed gutter. */
.copy { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 440px; z-index: 2; }
.icon { width: 104px; height: 104px; display: block; margin-bottom: 30px; filter: drop-shadow(0 16px 26px rgba(0,0,0,.22)); }
.eyebrow { display: inline-block; margin: 0 0 20px; padding: 8px 16px; border-radius: 999px;
           background: var(--pill-bg); border: 1px solid var(--pill-line);
           font-weight: 700; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; }
h1 { margin: 0; font: 700 88px/1 "Gabarito", sans-serif; letter-spacing: -0.03em; }
.promise { margin: 20px 0 0; font-weight: 500; font-size: 38px; line-height: 1.2; letter-spacing: -0.01em;
           color: var(--ink-soft); text-wrap: balance; }
.domain { margin: 34px 0 0; font-size: 24px; font-weight: 500; color: var(--ink-soft); }
/* The drawn interface: the system font, the way the real app renders. */
.ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: #1f2937; }
.win { position: absolute; background: #fff; border-radius: 22px;
       box-shadow: 0 40px 80px rgba(15,23,42,.30), 0 8px 20px rgba(15,23,42,.12); }
.bar { height: 11px; border-radius: 6px; background: #e5e7eb; }

.card { --gradient: linear-gradient(135deg,#122540 0%,#172f52 40%,#1e3c68 70%,#355e96 100%); --glow: radial-gradient(640px 520px at 94% 55%,rgba(170,200,240,.2),transparent 65%); --ink: #fff; --ink-soft: rgba(255,255,255,.92);
        --pill-bg: rgba(255,255,255,.13); --pill-line: rgba(255,255,255,.36); }
.ws{left:600px;top:50%;transform:translateY(-50%);width:820px;height:500px;border-radius:16px;background:#1b1b1b;display:flex;gap:10px;padding:10px;box-sizing:border-box;overflow:hidden}
.pane{background:#262626;border:1px solid #333;border-radius:10px;overflow:hidden;color:#e6e6e6}
.md{width:430px;flex:0 0 auto}.tb{flex:1;border-color:#4da3ff}
.ph{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border-bottom:1px solid #333;font-size:15px;font-weight:500}.ph em{margin-left:auto;font-style:normal;color:#9a9a9a}
.ml{display:flex;height:30px;align-items:center;font:500 13.5px/1 ui-monospace,"SF Mono",Menlo,monospace}.ml.hl{background:#2c3440}
.ln{width:38px;text-align:center;color:#8c8c8c;border-right:1px solid #333;height:100%;display:flex;align-items:center;justify-content:center;margin-right:10px}
.code{white-space:pre;color:#ededed}.ml.hl .code{font-weight:700}
.mdb{background:#252525;height:100%}
.tr{display:flex;height:34px;align-items:center;border-bottom:1px solid #333;font-size:14px}
.rn{width:44px;text-align:center;color:#8c8c8c;border-right:1px solid #333;height:100%;display:flex;align-items:center;justify-content:center}
.td{width:108px;padding:0 12px;border-right:1px solid #333;height:100%;display:flex;align-items:center;white-space:nowrap}.td.th{font-weight:700}
.tr.sel .td:first-of-type{box-shadow:inset 0 0 0 2px #4da3ff;background:#2c3440}
.code{display:flex;align-items:center}.cell{display:inline-flex;align-items:center;padding:0 1ch;box-sizing:content-box}.pp{color:#ededed}
.code .bar,.td .bar{height:8px;background:#4a4a4a;border-radius:4px;display:block}
.tr.sel .td.c1{box-shadow:inset 0 0 0 2px #4da3ff;background:#2c3440}
</style>
