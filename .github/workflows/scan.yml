name: Scan

# The weekly dependency audit (martonpaulo/workbench#1531): a new advisory arrives without a push, so
# Validate, which runs on a push, never sees it. A red run is the report. The workspace has one module,
# the pnpm workspace behind pnpm-lock.yaml; the Python under scripts/ uses only the standard library.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from package.json's packageManager, as in Validate.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Reads pnpm-lock.yaml only; nothing is installed.
      - name: Audit production dependencies
        run: pnpm audit --prod
