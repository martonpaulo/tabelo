name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Cancel superseded CI runs on the same ref (branch or PR) so redundant lint,
# test, and build work stops as soon as a newer commit arrives. The Pages
# deployment job below uses its own non-cancelling group so an in-progress
# deployment is never interrupted mid-flight; see that job for why.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: 1
            shard_total: 2
          - project: chromium
            shard: 2
            shard_total: 2
          - project: firefox
            shard: 1
            shard_total: 2
          - project: firefox
            shard: 2
            shard_total: 2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: >-
          pnpm --filter web exec playwright install
          --with-deps --only-shell ${{ matrix.project }}

      - name: Browser tests
        run: >-
          pnpm --filter web exec playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.shard_total }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  merge-reports:
    name: Merge Playwright reports
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        env:
          # v8.0.1 still emits DEP0005 from its bundled Actions toolkit on
          # Node 24. Keep the suppression scoped to that upstream action.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-${{ github.run_attempt }}-*
          merge-multiple: true

      - name: Merge Playwright reports
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/web/playwright-report
          retention-days: 14

  build-pages:
    name: Build GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Pages serves this project from /tabelo/, not from the domain root.
          BASE_PATH: /tabelo/

      # Pages has no SPA rewrite rule. Serving index.html as 404.html lets deep
      # links reach the client router instead of GitHub's error page.
      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e, build-pages]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Deployments queue instead of racing: a queued deployment superseded by a
    # newer one is skipped automatically, but cancel-in-progress stays false
    # so a deployment that already started is always allowed to finish rather
    # than leaving the Pages environment in a partially deployed state.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          # v5.0.0 still emits DEP0040 from its bundled Actions toolkit on
          # Node 24. Keep the suppression scoped to that upstream action.
          NODE_OPTIONS: --disable-warning=DEP0040
