name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-pages:
    name: Build GitHub Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Pages serves this project from /tabelo/, not from the domain root.
          BASE_PATH: /tabelo/

      # Pages has no SPA rewrite rule. Serving index.html as 404.html lets deep
      # links reach the client router instead of GitHub's error page.
      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    # Deployments queue instead of racing: a queued deployment superseded by a
    # newer one is skipped automatically, but cancel-in-progress stays false
    # so a deployment that already started is always allowed to finish rather
    # than leaving the Pages environment in a partially deployed state.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          # v5.0.0 still emits DEP0040 from its bundled Actions toolkit on
          # Node 24. Keep the suppression scoped to that upstream action.
          NODE_OPTIONS: --disable-warning=DEP0040
