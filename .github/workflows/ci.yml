name: CI

on:
  push:
    branches: [main]
    # These paths cannot affect the built site or its pipeline, so a push that
    # only touches them needs no run at all.
    paths-ignore:
      # Documentation anywhere in the repository
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".agents/**"
      - ".ao/**"
      - ".claude/**"
      - ".gemini/**"
      - ".github/instructions/**"
      - ".scratch/**"
  # No path filter on pull requests. `Check` is a required status check, and a
  # filtered trigger does not report a skipped check: GitHub leaves it expected
  # and waiting forever, so a documentation-only pull request could never merge.
  # Cost is controlled inside the job instead, where the Classify step already
  # selects browser coverage from the changed paths and gives a documentation
  # change no browser shards.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  TESTS_PER_SHARD: 250

# Cancel superseded CI runs on the same ref so redundant lint and test work
# stops as soon as a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classification is a shell script over the changed file list, so it shares
  # this runner instead of claiming one of its own. A separate job spent a
  # whole VM queueing for that script, and every extra queued job is another
  # chance for the run to die before it reaches the deploy.
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # Finds the last commit on main whose CI passed.
      actions: read
    outputs:
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      e2e_matrix: ${{ steps.e2e_matrix.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The path rules live in one script that Deploy shares, so the two can
      # never disagree about what a path needs. A pull request is classified by
      # its own files. A push is classified against the last commit on main
      # whose CI passed, not against the previous push: a push that cancelled
      # an unfinished run inherits that run's changes, so nothing it touched
      # can skip the browser suite. A manual run, or a history the API cannot
      # compare, selects everything.
      - name: Classify changes
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          changed="$RUNNER_TEMP/changed_files.txt"
          : > "$changed"
          case "${{ github.event_name }}" in
            pull_request)
              gh api "repos/$REPO/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate -q '.[] | .filename, (.previous_filename // empty)' \
                > "$changed" || : > "$changed"
              ;;
            push)
              base=$(gh run list --repo "$REPO" --workflow ci.yml --branch main \
                --event push --status success --limit 1 --json headSha -q '.[0].headSha' || true)
              if [[ -n "$base" ]]; then
                .github/scripts/changed-files.sh "$REPO" "$base" "${{ github.sha }}" \
                  > "$changed" || : > "$changed"
              fi
              ;;
          esac
          echo "Classifying $(wc -l < "$changed") changed path(s)."
          .github/scripts/classify-changes.sh < "$changed" | tee -a "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Knip needs the installed workspace to load the Vite, Vitest, and
      # Playwright configuration; without it every test file reports as unused.
      # It runs before the browser matrix so dead code fails the run before any
      # runner is claimed.
      - name: Dead-code check
        run: pnpm check:dead-code

      - name: Count selected browser tests and determine matrix
        id: e2e_matrix
        env:
          TEST_ARGS: ${{ steps.classify.outputs.test_args }}
        run: |
          if [[ "${{ steps.classify.outputs.run_e2e }}" != "true" ]]; then
            echo 'e2e_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The selection is a space-separated spec list, one argument each.
          read -ra specs <<< "$TEST_ARGS"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/playwright-list.json" \
            pnpm --filter web exec playwright test "${specs[@]}" \
              --project=chromium --list --reporter=json

          jq -e '.errors | length == 0' "$RUNNER_TEMP/playwright-list.json" \
            > /dev/null
          TEST_COUNT=$(jq '[.. | objects | select(has("tests")) | .tests[]?] | length' \
            "$RUNNER_TEMP/playwright-list.json")
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "No browser tests matched the selected scope." >&2
            exit 1
          fi

          SHARD_TOTAL=$(( (TEST_COUNT + TESTS_PER_SHARD - 1) / TESTS_PER_SHARD ))
          MATRIX=$(jq -cn \
            --arg project "chromium" \
            --arg test_args "$TEST_ARGS" \
            --argjson shard_total "$SHARD_TOTAL" \
            '{include: [range(1; $shard_total + 1) as $shard | {project: $project, shard: $shard, shard_total: $shard_total, test_args: $test_args}]}')

          echo "Selected $TEST_COUNT browser tests across $SHARD_TOTAL shard(s), with a limit of $TESTS_PER_SHARD tests per shard."
          echo "e2e_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

  # Browser coverage now waits for lint, types, and unit tests. That costs a
  # minute of latency and buys back every browser runner on a commit that was
  # already broken before any browser started.
  e2e:
    name: E2E (${{ matrix.project }}, shard ${{ matrix.shard }}/${{ matrix.shard_total }})
    needs: check
    if: ${{ needs.check.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # A pull request run is diagnostic, so every shard reports and the whole
      # picture arrives at once. A push to main is a deploy gate: one red shard
      # has already decided the outcome and the siblings have no reader.
      fail-fast: ${{ github.event_name == 'push' }}
      matrix: ${{ fromJSON(needs.check.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: >-
          pnpm --filter web exec playwright install
          --with-deps --only-shell ${{ matrix.project }}

      - name: Browser tests
        run: >-
          pnpm --filter web exec playwright test ${{ matrix.test_args }}
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.shard_total }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ github.run_attempt }}-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  merge-reports:
    name: Merge Playwright reports
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          # v8.0.1 still emits DEP0005 from its bundled Actions toolkit on
          # Node 24. Keep the suppression scoped to that upstream action.
          NODE_OPTIONS: --disable-warning=DEP0005
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-${{ github.run_attempt }}-*
          merge-multiple: true

      - name: Merge Playwright reports
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: apps/web/playwright-report
          retention-days: 14
