packages:
  - apps/*
  - packages/*
allowBuilds:
  sharp: true
catalog:
  zod: ^4.4.3
  typescript: ^6
  "@types/node": ^22.13.14
  lucide-react: ^1.23.0
  react: ^19.2.7
  react-dom: ^19.2.7
  sonner: ^2.0.7
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.2

# Transitive advisories the direct dependencies have not shipped a fix for yet.
# None of these reach the browser: they arrive through the shadcn CLI chain in
# @tabelo/ui and through the build-time image pipeline. Drop an entry once the
# package that pulls it in resolves the patched version on its own.
overrides:
  brace-expansion: ^5.0.9
  js-yaml: ^4.3.2
  nanoid: ^3.3.18
  qs: ^6.16.0
  hono: ^4.13.5
  sharp: ^0.35.4
